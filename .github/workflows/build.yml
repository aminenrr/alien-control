name: build

# 2.0.0-beta1.4 (build review #14): pushes build only on the release branches; every other branch builds through its
# pull request, so a push to a PR branch no longer runs twice.
on:
  push:
    branches: [main, v2.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 2.0.0-beta1.4 (build review #14): a newer push to the same branch / PR cancels the run still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
          # 2.0.0-beta1.4 (build review #14): NuGet cache (~/.nuget/packages), keyed on the project files
          cache: true
          cache-dependency-path: '**/*.csproj'
      # 2.0.0-beta1.4: duplicate keys, keys declared in both theme files and missing keys (was a PowerShell
      # duplicate-key check only)
      - name: XAML resource keys
        run: python dev/check_xaml_keys.py
      - name: Test
        run: dotnet test tests/AlienControl.Tests -c Release
      - name: Publish
        run: dotnet publish src/AlienControl/AlienControl.csproj -c Release -r win-x64 -o publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AlienControl-win-x64
          path: publish/
