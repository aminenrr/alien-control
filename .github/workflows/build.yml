name: build

# 2.0.0-beta1.4 (build review #14): pushes build only on the release branches; every other branch builds through its
# pull request, so a push to a PR branch no longer runs twice.
on:
  push:
    branches: [main, v2.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 2.0.0-beta1.4 (build review #14): a newer push to the same branch / PR cancels the run still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
          # 2.0.0-beta1.4 (build review #14): NuGet cache (~/.nuget/packages), keyed on the project files
          cache: true
          cache-dependency-path: '**/*.csproj'
      # 2.0.0-beta1.4: duplicate keys, keys declared in both theme files and missing keys (was a PowerShell
      # duplicate-key check only)
      - name: PresentMon (overlay frames, MIT, pinned)
        shell: pwsh
        run: |
          $d = "src/AlienControl/tools/PresentMon"
          New-Item -ItemType Directory -Force $d | Out-Null
          Invoke-WebRequest "https://github.com/GameTechDev/PresentMon/releases/download/v2.6.0/PresentMon-2.6.0-x64.exe" -OutFile "$d/PresentMon.exe"
          $h = (Get-FileHash "$d/PresentMon.exe" -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "b2a706bc6ad475749e3b7e3409263aa1e6906d45bdcf993f6dbc0f660188f1af") { Write-Host "::error::PresentMon hash $h"; exit 1 }
          Invoke-WebRequest "https://raw.githubusercontent.com/GameTechDev/PresentMon/v2.6.0/LICENSE.txt" -OutFile "$d/LICENSE.txt"
      # DIAG pass 3 only (Amine 2026-10-27): PresentMon 2.6.0 built from source with dev/diag/presentmon-2.6.0-drain.patch
      # (OutputThread drain interval settable, nothing else), shipped next to the official exe as PresentMon-drain.exe.
      # Runs only where the patch file exists (the diag branch). Release builds are untouched.
      - name: vcpkg binary cache (diag PresentMon)
        if: hashFiles('dev/diag/presentmon-2.6.0-drain.patch') != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/vcpkg-bin
          key: vcpkg-pm260-${{ runner.os }}-v1
      - name: PresentMon drain build (diag only, from source)
        if: hashFiles('dev/diag/presentmon-2.6.0-drain.patch') != ''
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-bin
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/vcpkg-bin" | Out-Null
          $pm = Join-Path $env:RUNNER_TEMP "pm"
          git -c core.autocrlf=false -c advice.detachedHead=false clone --depth 1 --branch v2.6.0 https://github.com/GameTechDev/PresentMon $pm
          Set-Location $pm
          $head = git rev-parse HEAD
          if ($head -ne "e13fce6acdb55a808fd8318175a56863e532d95f") { Write-Host "::error::PresentMon v2.6.0 is $head"; exit 1 }
          # the checkout may have turned the patch into CRLF; PresentMon's sources are LF
          $patch = Join-Path $env:RUNNER_TEMP "drain.patch"
          [IO.File]::WriteAllText($patch, ([IO.File]::ReadAllText("$env:GITHUB_WORKSPACE/dev/diag/presentmon-2.6.0-drain.patch") -replace "`r`n", "`n"))
          git -c core.autocrlf=false apply --verbose $patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git diff --stat
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install
          $msb = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          & $msb PresentMon\ConsoleApplication.sln /m /p:Configuration=Release /p:Platform=x64 /v:minimal
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $exe = Get-ChildItem -Recurse -Path . -Filter "PresentMon-*-x64.exe" | Where-Object { $_.DirectoryName -like "*\build\Release" } | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::no PresentMon exe"; exit 1 }
          Write-Host ("built " + $exe.FullName)
          $dst = "$env:GITHUB_WORKSPACE/src/AlienControl/tools/PresentMon/PresentMon-drain.exe"
          Copy-Item $exe.FullName $dst
          Write-Host ("PresentMon-drain.exe sha256 " + (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower() + " bytes " + (Get-Item $dst).Length)
      - name: XAML resource keys
        run: python dev/check_xaml_keys.py
      - name: Test
        run: dotnet test tests/AlienControl.Tests -c Release
      - name: Publish
        run: dotnet publish src/AlienControl/AlienControl.csproj -c Release -r win-x64 -o publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AlienControl-win-x64
          path: publish/
