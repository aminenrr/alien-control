name: build

on:
  push:
    branches: [main, v1.3, v2.0, beta1.3-ov]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: PresentMon (beta1.3-ov overlay frames, MIT, pinned)
        shell: pwsh
        run: |
          $d = "src/AlienControl/tools/PresentMon"
          New-Item -ItemType Directory -Force $d | Out-Null
          Invoke-WebRequest "https://github.com/GameTechDev/PresentMon/releases/download/v2.6.0/PresentMon-2.6.0-x64.exe" -OutFile "$d/PresentMon.exe"
          $h = (Get-FileHash "$d/PresentMon.exe" -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "b2a706bc6ad475749e3b7e3409263aa1e6906d45bdcf993f6dbc0f660188f1af") { Write-Host "::error::PresentMon hash $h"; exit 1 }
          Invoke-WebRequest "https://raw.githubusercontent.com/GameTechDev/PresentMon/v2.6.0/LICENSE.txt" -OutFile "$d/LICENSE.txt"
      - name: XAML duplicate keys
        shell: pwsh
        run: |
          $bad = $false
          Get-ChildItem src -Recurse -Filter *.xaml | ForEach-Object {
            $keys = [regex]::Matches((Get-Content $_.FullName -Raw), 'x:Key="([^"]+)"') | ForEach-Object { $_.Groups[1].Value }
            $keys | Group-Object | Where-Object Count -gt 1 | ForEach-Object { Write-Host "::error::duplicate x:Key '$($_.Name)'"; $bad = $true }
          }
          if ($bad) { exit 1 }
      - name: Test
        run: dotnet test tests/AlienControl.Tests -c Release
      - name: Publish
        run: dotnet publish src/AlienControl/AlienControl.csproj -c Release -r win-x64 -o publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AlienControl-win-x64
          path: publish/
