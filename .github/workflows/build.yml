name: build

on:
  push:
    branches: [main, v1.3, v2.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: XAML duplicate keys
        shell: pwsh
        run: |
          $bad = $false
          Get-ChildItem src -Recurse -Filter *.xaml | ForEach-Object {
            $keys = [regex]::Matches((Get-Content $_.FullName -Raw), 'x:Key="([^"]+)"') | ForEach-Object { $_.Groups[1].Value }
            $keys | Group-Object | Where-Object Count -gt 1 | ForEach-Object { Write-Host "::error::duplicate x:Key '$($_.Name)'"; $bad = $true }
          }
          if ($bad) { exit 1 }
      - name: Test
        run: dotnet test tests/AlienControl.Tests -c Release
      - name: Publish
        run: dotnet publish src/AlienControl/AlienControl.csproj -c Release -r win-x64 -o publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AlienControl-win-x64
          path: publish/
