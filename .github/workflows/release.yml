name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test tests/AlienControl.Tests -c Release
      - name: Publish
        run: dotnet publish src/AlienControl/AlienControl.csproj -c Release -r win-x64 -o publish
      - name: Zip
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          Copy-Item README.md publish/
          Compress-Archive -Path publish/* -DestinationPath "AlienControl-$v-win-x64.zip"
          $zip = "AlienControl-$v-win-x64.zip"
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  " + $zip | Out-File -Encoding ascii SHA256SUMS
          "VER=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Alien Controls ${{ env.VER }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            AlienControl-${{ env.VER }}-win-x64.zip
            SHA256SUMS
          prerelease: ${{ contains(github.ref_name, '-') }}
